table: raw_sap_ewm.scwm_t301
layer: raw
source_system: SAP_EWM
description: Storage types per warehouse (EWM table /SCWM/T301). Storage type roles differ by warehouse; see scwm_t301t for descriptions.
grain: One row per client, warehouse number, and storage type.
primary_key: [mandt, lgnum, lgtyp]
domain: WarehouseOperations
subdomain: WarehouseOperations/Layout
sensitivity: internal
site_key: {column: lgnum, kind: warehouse}
columns:
  - {name: mandt, type: STRING, nullable: false, sap_type: CLNT3, comment: "SAP client."}
  - {name: lgnum, type: STRING, nullable: false, sap_type: CHAR4, comment: "Warehouse number (RR01, SZ01, DG01)."}
  - {name: lgtyp, type: STRING, nullable: false, sap_type: CHAR4, comment: "Storage type code."}
  - {name: st_role, type: STRING, nullable: false, sap_type: CHAR1, comment: "Storage type role: A = standard storage, D = identification/staging point, E = work center area."}
  - {name: put_rule, type: STRING, nullable: false, sap_type: CHAR1, comment: "Putaway rule: 1 = empty bin, 2 = addition to existing stock."}
tests:
  accepted_values:
    - {column: lgnum, values: [RR01, SZ01, DG01]}
    - {column: st_role, values: [A, D, E]}
access: [ops_analyst_global, site_manager_rr, site_manager_cn]
