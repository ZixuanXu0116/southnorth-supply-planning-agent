table: raw_sap_ewm.scwm_lagp
layer: raw
source_system: SAP_EWM
description: Storage bins (EWM table /SCWM/LAGP). At Longgang (SZ01), storage type AS01 represents AutoStore bins.
grain: One row per client, warehouse number, and storage bin.
primary_key: [mandt, lgnum, lgpla]
domain: WarehouseOperations
subdomain: WarehouseOperations/Layout
sensitivity: internal
site_key: {column: lgnum, kind: warehouse}
columns:
  - {name: mandt, type: STRING, nullable: false, sap_type: CLNT3, comment: "SAP client."}
  - {name: lgnum, type: STRING, nullable: false, sap_type: CHAR4, comment: "Warehouse number."}
  - {name: lgpla, type: STRING, nullable: false, sap_type: CHAR18, comment: "Storage bin."}
  - {name: lgtyp, type: STRING, nullable: false, sap_type: CHAR4, comment: "Storage type of the bin."}
  - {name: lgber, type: STRING, nullable: false, sap_type: CHAR4, comment: "Storage section."}
  - {name: lptyp, type: STRING, nullable: false, sap_type: CHAR4, comment: "Storage bin type."}
  - {name: aisle, type: STRING, nullable: false, sap_type: CHAR3, comment: "Aisle; blank for AutoStore and zone bins."}
  - {name: stack, type: STRING, nullable: false, sap_type: CHAR3, comment: "Stack / column; blank for AutoStore and zone bins."}
  - {name: lvl_v, type: STRING, nullable: false, sap_type: CHAR3, comment: "Level; blank for AutoStore and zone bins."}
  - {name: kzler, type: STRING, nullable: false, sap_type: CHAR1, comment: "'X' if the bin was empty at extraction time."}
  - {name: skzue, type: STRING, nullable: false, sap_type: CHAR1, comment: "'X' if the bin is blocked for putaway."}
  - {name: skzua, type: STRING, nullable: false, sap_type: CHAR1, comment: "'X' if the bin is blocked for stock removal."}
  - {name: max_weight, type: "DECIMAL(15,3)", nullable: false, sap_type: QUAN15_3, comment: "Maximum weight in KG."}
tests:
  relationships:
    - {columns: [mandt, lgnum, lgtyp], references: raw_sap_ewm.scwm_t301, ref_columns: [mandt, lgnum, lgtyp]}
access: [ops_analyst_global, site_manager_rr, site_manager_cn]
