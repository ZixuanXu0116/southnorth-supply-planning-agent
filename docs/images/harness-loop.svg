<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 816" width="760" height="816" role="img" aria-labelledby="t2 d2">
  <title id="t2">One planner task, turn by turn</title>
  <desc id="d2">The harness starts the task and repeats turns: it sends the context to the model, the model replies, every tool call is checked before it runs, reads run freely and the task's one write is checked by the case server, the result is appended, and finishTurn decides whether to stop. A refused write comes back as an error with a hint.</desc>
  <style>
    svg { --bg: #f7f8fa; --fg: #1d2430; --muted: #5b6474; --panel: #ffffff; --line: #8a93a3;
          --frame: #b9c0cc; --accent: #0b6e4f; --warn: #b4530a; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #141820; --fg: #e6e9ef; --muted: #a2abba; --panel: #1c212b; --line: #6d7686;
            --frame: #4a5262; --accent: #5fd3a8; --warn: #f0a35a; }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .side { fill: var(--panel); stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 3; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: var(--fg); stroke-width: 1.3; }
    .loop { fill: none; stroke: var(--accent); stroke-width: 2; }
    .reject { fill: none; stroke: var(--warn); stroke-width: 1.8; }
    .t { font: 12.5px -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--fg); }
    .head { font: 600 12.5px -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--fg); }
    .num { font-weight: 600; fill: var(--accent); }
    .detail { font: 11.5px -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
    .label { font: 11.5px -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
    .frame-label { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); }
    .accent { font: 600 12px -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--accent); }
    .warn { font: 600 11.5px -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--warn); }
    .arrow { fill: var(--fg); } .arrow-accent { fill: var(--accent); } .arrow-warn { fill: var(--warn); }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-warn" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="816"/>

  <!-- 1 start -->
  <rect class="box" x="200" y="20" width="360" height="36" rx="5"/>
  <text class="t" x="380" y="42" text-anchor="middle"><tspan class="num">1</tspan>  Start: the task the case state calls for</text>
  <line class="edge" x1="380" y1="56" x2="380" y2="86" marker-end="url(#b)"/>

  <!-- loop frame -->
  <rect class="frame" x="30" y="74" width="700" height="666" rx="10"/>
  <text class="frame-label" x="44" y="90">each turn</text>

  <!-- 2, 3 -->
  <rect class="box" x="200" y="88" width="360" height="36" rx="5"/>
  <text class="t" x="380" y="110" text-anchor="middle"><tspan class="num">2</tspan>  Send the context to the model</text>
  <line class="edge" x1="380" y1="124" x2="380" y2="140" marker-end="url(#b)"/>
  <rect class="box" x="200" y="142" width="360" height="36" rx="5"/>
  <text class="t" x="380" y="164" text-anchor="middle"><tspan class="num">3</tspan>  Model replies: text + tool calls</text>
  <line class="edge" x1="380" y1="178" x2="380" y2="192" marker-end="url(#b)"/>

  <!-- tool calls? -->
  <polygon class="box" points="380,194 460,226 380,258 300,226"/>
  <text class="t" x="380" y="230" text-anchor="middle">Tool calls?</text>
  <path class="edge" d="M460,226 L700,226 L700,700 L564,700" marker-end="url(#b)"/>
  <text class="label" x="472" y="218">no</text>
  <line class="edge" x1="380" y1="258" x2="380" y2="276" marker-end="url(#b)"/>
  <text class="label" x="390" y="272">yes</text>

  <!-- 4 -->
  <rect class="box" x="200" y="278" width="360" height="36" rx="5"/>
  <text class="t" x="380" y="300" text-anchor="middle"><tspan class="num">4</tspan>  beforeToolCall: one write, alone in its turn</text>
  <line class="edge" x1="380" y1="314" x2="380" y2="328" marker-end="url(#b)"/>

  <!-- read or write? -->
  <polygon class="box" points="380,330 470,362 380,394 290,362"/>
  <text class="t" x="380" y="366" text-anchor="middle">Read or write?</text>
  <path class="edge" d="M290,362 L200,362 L200,408" marker-end="url(#b)"/>
  <text class="label" x="226" y="354">read</text>
  <path class="edge" d="M470,362 L560,362 L560,408" marker-end="url(#b)"/>
  <text class="label" x="500" y="354">write</text>

  <rect class="box" x="90" y="410" width="220" height="50" rx="5"/>
  <text class="head" x="200" y="431" text-anchor="middle">Read</text>
  <text class="detail" x="200" y="449" text-anchor="middle">case · prices · ranking · KB</text>
  <rect class="box" x="450" y="410" width="220" height="50" rx="5"/>
  <text class="head" x="560" y="431" text-anchor="middle">Write, one per task</text>
  <text class="detail" x="560" y="449" text-anchor="middle">checked by the case server</text>
  <line class="edge" x1="560" y1="460" x2="560" y2="474" marker-end="url(#b)"/>

  <!-- accepted? -->
  <polygon class="box" points="560,476 630,506 560,536 490,506"/>
  <text class="t" x="560" y="510" text-anchor="middle">Accepted?</text>
  <path class="reject" d="M630,506 L680,506 L680,646 L564,646" marker-end="url(#b-warn)"/>
  <text class="warn" x="638" y="498">no</text>
  <text class="warn" x="672" y="590" text-anchor="middle" transform="rotate(-90 672 590)">error + hint</text>
  <line class="edge" x1="560" y1="536" x2="560" y2="552" marker-end="url(#b)"/>
  <text class="label" x="570" y="549">yes</text>
  <rect class="box" x="480" y="554" width="160" height="32" rx="5"/>
  <text class="t" x="560" y="574" text-anchor="middle">case event appended</text>

  <!-- joins -->
  <path class="edge" d="M200,460 L200,610 L380,610"/>
  <path class="edge" d="M560,586 L560,610 L380,610"/>
  <line class="edge" x1="380" y1="610" x2="380" y2="626" marker-end="url(#b)"/>

  <!-- 5, 6 -->
  <rect class="box" x="200" y="628" width="360" height="36" rx="5"/>
  <text class="t" x="380" y="650" text-anchor="middle"><tspan class="num">5</tspan>  Result appended to the transcript</text>
  <line class="edge" x1="380" y1="664" x2="380" y2="680" marker-end="url(#b)"/>
  <rect class="box" x="200" y="682" width="360" height="36" rx="5"/>
  <text class="t" x="380" y="704" text-anchor="middle"><tspan class="num">6</tspan>  finishTurn: written or over budget?</text>
  <path class="loop" d="M200,700 L70,700 L70,106 L196,106" marker-end="url(#b-accent)"/>
  <text class="accent" x="62" y="400" text-anchor="middle" transform="rotate(-90 62 400)">no: next turn</text>

  <!-- exit -->
  <line class="edge" x1="380" y1="718" x2="380" y2="760" marker-end="url(#b)"/>
  <text class="label" x="390" y="752">yes: stop</text>

  <!-- 7 -->
  <rect class="box" x="200" y="762" width="360" height="36" rx="5"/>
  <text class="t" x="380" y="784" text-anchor="middle"><tspan class="num">7</tspan>  Wrap up: trace and result saved</text>
  <rect class="side" x="580" y="764" width="150" height="34" rx="5"/>
  <text class="detail" x="655" y="785" text-anchor="middle">300 s wall clock → abort</text>
</svg>
