[project]
name = "snm-web"
version = "0.0.0"
description = "Thin web app over the case server: the purchasing case page and the supplier page (decision record 005)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.18",
    "snm-cases",
    "snm-data",
    "uvicorn>=0.30",
]

[project.scripts]
snm-web = "snm_web.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snm_web"]

[tool.uv.sources]
snm-cases = { workspace = true }
snm-data = { workspace = true }
