  - id: c124
    split: test
    question: >-
      Measured from the goods receipt posting in ECC, what was the median time until putaway was confirmed
      for Round Rock receipts in fiscal period 11 of FY2026?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [timezone, cross_system_join]
    required_kb_docs: [guides/inbound_flow.md, metrics/dock_to_stock_time.md, concepts/time_zones.md]
    required_tables: [raw_sap_ecc.mseg, raw_sap_ecc.mkpf, raw_sap_ewm.scdl_db_refdoc, raw_sap_ewm.scwm_ordim_c]
    notes: >-
      ECC entry time (CPUDT/CPUTM) is America/Chicago; EWM CONFIRMED_AT is UTC. Without the conversion the
      result is off by five or six hours. The governed dock-to-stock time (from the putaway task creation)
      is within the tolerance.
    reference_sql: |
      WITH gr AS (
        SELECT s.ebeln,
               to_utc_timestamp(to_timestamp(concat(m.cpudt, m.cputm), 'yyyyMMddHHmmss'), 'America/Chicago')
                 AS gr_utc,
               m.budat
        FROM raw_sap_ecc.mseg s
        JOIN raw_sap_ecc.mkpf m ON m.mblnr = s.mblnr AND m.mjahr = s.mjahr
        WHERE s.bwart = '101' AND s.werks = 'US10'
      ),
      putaway AS (
        SELECT r.refdocno AS ebeln, to_timestamp(cast(t.confirmed_at AS STRING), 'yyyyMMddHHmmss') AS stored_utc
        FROM raw_sap_ewm.scwm_ordim_c t
        JOIN raw_sap_ewm.scdl_db_refdoc r ON r.docid = t.rdocid AND r.itemid = t.ritmid AND r.refdoccat = 'PO'
        WHERE t.lgnum = 'RR01' AND t.procty = '1011' AND t.tostat = 'C'
      )
      SELECT percentile((unix_timestamp(p.stored_utc) - unix_timestamp(g.gr_utc)) / 60.0, 0.5) AS median_minutes
      FROM gr g JOIN putaway p ON p.ebeln = g.ebeln
      WHERE g.budat BETWEEN '20260824' AND '20260920'
    answer:
      values: [{column: median_minutes, rel: 0.06, unit: minutes}]

  # ---------------------------------------------------------------- multi-step
  - id: c125
    question: >-
      Which destination storage type at Round Rock had the slowest median dock-to-stock time in fiscal
      period 11 of FY2026, and what was it?
    role: ops_analyst_global
    category: multi_step
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [metric_definition]
    required_kb_docs: [metrics/dock_to_stock_time.md, guides/inbound_flow.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c]
    reference_sql: |
      WITH putaway AS (
        SELECT rdocid, ritmid,
               MIN(created_at) AS gr_at, MIN(created_at_wh) AS gr_at_wh,
               MAX(CASE WHEN tostat = 'C' THEN confirmed_at END) AS stored_at,
               MAX(CASE WHEN tostat = 'C' THEN nltyp END) AS nltyp
        FROM raw_sap_ewm.scwm_ordim_c
        WHERE lgnum = 'RR01' AND procty = '1011' AND rdoccat = 'PDI'
        GROUP BY rdocid, ritmid
      )
      SELECT nltyp,
             percentile((unix_timestamp(to_timestamp(cast(stored_at AS STRING), 'yyyyMMddHHmmss'))
                         - unix_timestamp(to_timestamp(cast(gr_at AS STRING), 'yyyyMMddHHmmss'))) / 60.0,
                        0.5) AS median_minutes
      FROM putaway
      WHERE stored_at IS NOT NULL AND substr(cast(gr_at_wh AS STRING), 1, 8) BETWEEN '20260824' AND '20260920'
      GROUP BY nltyp
      ORDER BY median_minutes DESC
      LIMIT 1
    answer:
      keys: [nltyp]
      values: [{column: median_minutes, rel: 0.05, unit: minutes}]

  # ---------------------------------------------------------------- investigation: injected scenario A2
  - id: c126
    split: test
    question: >-
      Some Round Rock receipts have been taking much longer to put away since the summer. Which products
      are affected, since when, and what is the likely cause?
    role: ops_analyst_global
    category: investigation
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [scenario_a2]
    required_kb_docs: [guides/inbound_flow.md, metrics/dock_to_stock_time.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c, raw_sap_ewm.sapapo_matlwh, raw_sap_ewm.sapapo_matkey, raw_sap_ecc.mara]
    notes: >-
      Scenario A2: from 2026-06-29, fasteners (material group SP-FST) are put away to the high rack (0010,
      PACI HRCK) instead of shelving, and wait for the reach truck. The answer must name the group and the
      high-rack destination or the PACI.
    reference_sql: |
      SELECT MIN(substr(cast(t.created_at_wh AS STRING), 1, 8)) AS first_high_rack_putaway, COUNT(*) AS putaways
      FROM raw_sap_ewm.scwm_ordim_c t
      JOIN raw_sap_ewm.sapapo_matkey k ON k.matid = t.matid
      JOIN raw_sap_ecc.mara a ON ltrim('0', a.matnr) = ltrim('0', k.matnr)
      WHERE t.lgnum = 'RR01' AND t.procty = '1011' AND t.tostat = 'C' AND t.nltyp = '0010' AND a.matkl = 'SP-FST'
    answer:
      must_mention: [[SP-FST, fastener], ["0010", HRCK, high rack, high-rack]]

  - id: c127
    question: Putaway of fasteners (material group SP-FST) at Round Rock got slower this year. What changed, and when?
    role: ops_analyst_global
    category: investigation
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [scenario_a2]
    required_kb_docs: [guides/inbound_flow.md, metrics/dock_to_stock_time.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c, raw_sap_ewm.sapapo_matlwh, raw_sap_ewm.sapapo_matkey, raw_sap_ecc.mara]
    notes: >-
      Scenario A2. The answer must name the new destination (high rack 0010) or the PACI change, and the
      timing (late June or early July 2026).
    reference_sql: |
      SELECT MIN(substr(cast(t.created_at_wh AS STRING), 1, 8)) AS first_high_rack_putaway, COUNT(*) AS putaways
      FROM raw_sap_ewm.scwm_ordim_c t
      JOIN raw_sap_ewm.sapapo_matkey k ON k.matid = t.matid
      JOIN raw_sap_ecc.mara a ON ltrim('0', a.matnr) = ltrim('0', k.matnr)
      WHERE t.lgnum = 'RR01' AND t.procty = '1011' AND t.tostat = 'C' AND t.nltyp = '0010' AND a.matkl = 'SP-FST'
    answer:
      must_mention: [["0010", HRCK, high rack, high-rack, PACI, putaway control], [June, July, "2026-06", "2026-07", "06-29", "06-30", "07-01"]]
