# Evaluation bank v3: bank v2 plus 11 cases on EWM inbound and putaway (c117-c127). Owner review pending.
#
# Needs generator 0.3.0 (inbound deliveries, putaway tasks, PACI, scenario A2). The investigation cases
# check the explanation with must_mention terms. Same conventions as seed.yaml; about 45 % of the new
# cases are in the locked test split.

suite: bank_v3
as_of: "2026-09-21"  # Monday, first day of FY2026 P12; ECC extracted 2026-09-21 05:00 UTC
data_snapshot: {profile: small, generator_version: 0.8.0, seed: 20260924}
includes: [bank_v2]

cases:
  # ---------------------------------------------------------------- covered: dock-to-stock
  - id: c117
    question: What was the median dock-to-stock time at each warehouse for receipts in fiscal period 11 of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [cancelled_tasks, metric_definition]
    required_kb_docs: [metrics/dock_to_stock_time.md, guides/inbound_flow.md, concepts/fiscal_calendar.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c]
    notes: >-
      Receipt to confirmed putaway per inbound delivery item, by site-local receipt date (2026-08-24 to
      2026-09-20). Dongguan has no inbound deliveries in the extract. Starting from the ECC goods receipt
      posting (converted to UTC) adds about two minutes and passes (6 % tolerance, as in c124).
    reference_sql: |
      WITH putaway AS (
        SELECT lgnum, rdocid, ritmid,
               MIN(created_at) AS gr_at, MIN(created_at_wh) AS gr_at_wh,
               MAX(CASE WHEN tostat = 'C' THEN confirmed_at END) AS stored_at
        FROM raw_sap_ewm.scwm_ordim_c
        WHERE procty = '1011' AND rdoccat = 'PDI'
        GROUP BY lgnum, rdocid, ritmid
      )
      SELECT lgnum,
             percentile((unix_timestamp(to_timestamp(cast(stored_at AS STRING), 'yyyyMMddHHmmss'))
                         - unix_timestamp(to_timestamp(cast(gr_at AS STRING), 'yyyyMMddHHmmss'))) / 60.0,
                        0.5) AS median_minutes
      FROM putaway
      WHERE stored_at IS NOT NULL AND substr(cast(gr_at_wh AS STRING), 1, 8) BETWEEN '20260824' AND '20260920'
      GROUP BY lgnum
    answer:
      keys: [lgnum]
      values: [{column: median_minutes, rel: 0.06, unit: minutes}]

  - id: c118
    split: test
    question: >-
      What were the median and 90th-percentile dock-to-stock times at Longgang for receipts in fiscal Q3
      of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [cancelled_tasks, metric_definition, bonded]
    required_kb_docs: [metrics/dock_to_stock_time.md, guides/inbound_flow.md, sites/longgang.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c]
    notes: FY2026 Q3 = 2026-04-27 to 2026-07-26 by site-local receipt date; warehouse SZ01 including bonded receipts.
    reference_sql: |
      WITH putaway AS (
        SELECT rdocid, ritmid,
               MIN(created_at) AS gr_at, MIN(created_at_wh) AS gr_at_wh,
               MAX(CASE WHEN tostat = 'C' THEN confirmed_at END) AS stored_at
        FROM raw_sap_ewm.scwm_ordim_c
        WHERE lgnum = 'SZ01' AND procty = '1011' AND rdoccat = 'PDI'
        GROUP BY rdocid, ritmid
      ),
      d AS (
        SELECT (unix_timestamp(to_timestamp(cast(stored_at AS STRING), 'yyyyMMddHHmmss'))
                - unix_timestamp(to_timestamp(cast(gr_at AS STRING), 'yyyyMMddHHmmss'))) / 60.0 AS minutes
        FROM putaway
        WHERE stored_at IS NOT NULL AND substr(cast(gr_at_wh AS STRING), 1, 8) BETWEEN '20260427' AND '20260726'
      )
      SELECT percentile(minutes, 0.5) AS median_minutes, percentile(minutes, 0.9) AS p90_minutes FROM d
    answer:
      values: [{column: median_minutes, rel: 0.06, unit: minutes}, {column: p90_minutes, rel: 0.06, unit: minutes}]

