      FROM raw_sap_ewm.scwm_ordim_c
      WHERE lgnum = 'RR01' AND procty IN ('2010', '2020') AND tostat = 'C'
      GROUP BY procty
    answer:
      must_mention: [[RFID, LTS], [confirmed late, late confirmation, confirmed later, delayed confirmation, confirmation delay, confirm late, confirmations lag, after the physical pick, after the pick]]
