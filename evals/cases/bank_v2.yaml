  - id: c104
    split: test
    question: How many of Seoin Flow Control's purchase orders were delivered late in fiscal Q3 of FY2026?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [metric_definition, expedited_orders]
    required_kb_docs: [metrics/supplier_on_time_delivery.md, guides/procurement_and_stock.md]
    required_tables: [raw_sap_ecc.ekko, raw_sap_ecc.eket, raw_sap_ecc.mseg, raw_sap_ecc.lfa1]
    notes: >-
      Governed definition: standard orders (NB), first receipt in the quarter, late = first receipt more
      than one day after EINDT. Without the grace day the count is much higher.
    reference_sql: |
      WITH first_gr AS (
        SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
      )
      SELECT SUM(CASE WHEN g.first_receipt > date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                      THEN 1 ELSE 0 END) AS late_orders
      FROM raw_sap_ecc.ekko k
      JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
      JOIN first_gr g ON g.ebeln = k.ebeln
      JOIN raw_sap_ecc.lfa1 l ON l.lifnr = k.lifnr
      WHERE k.bsart = 'NB' AND l.name1 = 'Seoin Flow Control'
        AND g.first_receipt BETWEEN '20260427' AND '20260726'
    answer:
      values: [{column: late_orders, abs: 0}]

  - id: c108
    split: test
    question: How many pick tasks were confirmed during shift A at Dongguan in fiscal period 11 of FY2026?
    role: ops_analyst_global
