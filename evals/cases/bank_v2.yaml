  - id: c109
    question: >-
      How much outbound demand did the Longgang main warehouse have in fiscal period 11 of FY2026, including the
      replenishment of Dongguan?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [transfers_not_demand, transfer_double_count]
    required_kb_docs: [concepts/internal_transfers.md, metrics/days_of_supply.md, sites/longgang.md]
    required_tables: [raw_sap_ecc.mseg]
    notes: >-
      Main-warehouse demand = issues to manufacturing at CN10/1000 (311 to 2100 net of 312) plus transfers out to Dongguan
      (313 issuing items only; 315 and the 313 receiving item are the same goods). Customer demand from
      delivery quantities instead of goods-issue postings differs by well under 0.2 %, which passes.
    reference_sql: |
      SELECT SUM(CASE WHEN bwart = '311' THEN menge WHEN bwart = '312' THEN -menge ELSE 0 END) AS manufacturing_qty,
             SUM(CASE WHEN bwart = '313' AND shkzg = 'H' THEN menge ELSE 0 END) AS transfer_qty,
             SUM(CASE WHEN bwart = '311' THEN menge WHEN bwart = '312' THEN -menge
                      WHEN bwart = '313' AND shkzg = 'H' THEN menge ELSE 0 END) AS hub_demand_qty
      FROM raw_sap_ecc.mseg
      WHERE werks = 'CN10' AND lgort = '1000'
        AND ((bwart = '311' AND shkzg = 'H' AND umlgo = '2100') OR (bwart = '312' AND shkzg = 'S' AND umlgo = '2100') OR bwart = '313')
        AND budat_mkpf BETWEEN '20260824' AND '20260920'
    answer:
      values: [{column: hub_demand_qty, rel: 0.002}]

  - id: c110
    question: What was the median pick cycle time for each shift at Dongguan in fiscal period 11 of FY2026?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [site_calendar, metric_definition]
    required_kb_docs: [sites/dongguan.md, metrics/pick_cycle_time.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c]
    notes: Shifts A 07:00-15:00 and B 15:00-23:00 local by confirmation time; creation to confirmation.
    reference_sql: |
      SELECT CASE WHEN substr(cast(confirmed_at_wh AS STRING), 9, 2) BETWEEN '07' AND '14' THEN 'A' ELSE 'B' END
               AS shift,
             percentile((unix_timestamp(to_timestamp(cast(confirmed_at AS STRING), 'yyyyMMddHHmmss'))
                         - unix_timestamp(to_timestamp(cast(created_at AS STRING), 'yyyyMMddHHmmss'))) / 60.0,
                        0.5) AS median_minutes
      FROM raw_sap_ewm.scwm_ordim_c
      WHERE lgnum = 'DG01' AND tostat = 'C' AND procty IN ('2010', '2020')
        AND substr(cast(confirmed_at_wh AS STRING), 1, 8) BETWEEN '20260824' AND '20260920'
        AND substr(cast(confirmed_at_wh AS STRING), 9, 2) BETWEEN '07' AND '22'
      GROUP BY 1
    answer:
      keys: [shift]
      values: [{column: median_minutes, rel: 0.03, unit: minutes}]

