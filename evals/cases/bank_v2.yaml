  # ---------------------------------------------------------------- multi-step: a governed metric feeds a follow-up
  - id: c105
    question: >-
      For the supplier with the lowest on-time delivery rate so far in fiscal year 2026, how many purchase
      order schedule lines are still open, and how many of those are overdue?
    role: ops_analyst_global
    category: multi_step
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [metric_definition]
    required_kb_docs: [metrics/supplier_on_time_delivery.md, guides/procurement_and_stock.md]
    required_tables: [raw_sap_ecc.ekko, raw_sap_ecc.eket, raw_sap_ecc.mseg, raw_sap_ecc.lfa1]
    notes: Step 1 = governed supplier OTD per vendor (Hoshino RF Devices); step 2 = open (WEMNG < MENGE) and overdue (EINDT before today).
    reference_sql: |
      WITH first_gr AS (
        SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
      ),
      worst AS (
        SELECT k.lifnr
        FROM raw_sap_ecc.ekko k
        JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
        JOIN first_gr g ON g.ebeln = k.ebeln
        WHERE k.bsart = 'NB' AND g.first_receipt >= '20251027'
        GROUP BY k.lifnr
        ORDER BY AVG(CASE WHEN g.first_receipt <= date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                          THEN 1.0 ELSE 0.0 END)
        LIMIT 1
      )
      SELECT l.name1,
             SUM(CASE WHEN e.wemng < e.menge THEN 1 ELSE 0 END) AS open_lines,
             SUM(CASE WHEN e.wemng < e.menge AND e.eindt < '20260921' THEN 1 ELSE 0 END) AS overdue_lines
      FROM worst w
      JOIN raw_sap_ecc.lfa1 l ON l.lifnr = w.lifnr
      JOIN raw_sap_ecc.ekko k ON k.lifnr = w.lifnr
      JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
      GROUP BY l.name1
    answer:
      keys: [name1]
      values: [{column: open_lines, abs: 0}, {column: overdue_lines, abs: 0}]

  - id: c106
    split: test
    question: >-
      Which material needed the most emergency transfers to Dongguan so far in fiscal year 2026, and how
      many days of supply does Dongguan have of it at the end of 2026-09-20?
    role: ops_analyst_global
    category: multi_step
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [system_users, transfer_double_count, metric_definition]
    required_kb_docs: [concepts/internal_transfers.md, metrics/days_of_supply.md, sites/dongguan.md]
    required_tables: [raw_sap_ecc.mkpf, raw_sap_ecc.mseg, raw_ext.inventory_snapshot_daily]
    notes: Step 1 = 313 documents posted by RFC-EWM per material (40000360, 7 transfers); step 2 = governed days of supply at 3000.
    reference_sql: |
      WITH top_material AS (
        SELECT s.matnr, COUNT(DISTINCT m.mblnr) AS emergency_transfers
        FROM raw_sap_ecc.mkpf m
        JOIN raw_sap_ecc.mseg s ON s.mblnr = m.mblnr AND s.mjahr = m.mjahr
        WHERE s.bwart = '313' AND s.shkzg = 'H' AND m.usnam = 'RFC-EWM' AND m.budat >= '20251027'
        GROUP BY s.matnr
        ORDER BY emergency_transfers DESC, s.matnr
        LIMIT 1
      ),
      demand AS (
        SELECT matnr, SUM(CASE WHEN bwart = '311' THEN menge ELSE -menge END) / 28.0 AS avg_daily_demand
        FROM raw_sap_ecc.mseg
        WHERE werks = 'CN10' AND lgort = '3000' AND umlgo = '2100'
          AND ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S'))
          AND budat_mkpf BETWEEN '20260824' AND '20260920'
        GROUP BY matnr
      ),
      stock AS (
        SELECT matnr, quantity
        FROM raw_ext.inventory_snapshot_daily
        WHERE snapshot_date = DATE'2026-09-20' AND werks = 'CN10' AND lgort = '3000'
          AND stock_category = 'UNRESTRICTED'
      )
      SELECT ltrim('0', t.matnr) AS material, t.emergency_transfers,
             ROUND(COALESCE(s.quantity, 0) / d.avg_daily_demand, 2) AS days_of_supply
      FROM top_material t
      JOIN demand d ON d.matnr = t.matnr
      LEFT JOIN stock s ON s.matnr = t.matnr
    answer:
      keys: [material]
      values: [{column: emergency_transfers, abs: 0}, {column: days_of_supply, rel: 0.03, unit: days}]

  - id: c107
    question: >-
      What was Dongguan's on-time PGI rate in fiscal period 11 of FY2026, and in the same period of the
      previous fiscal year?
    role: ops_analyst_global
    category: multi_step
    expected_behavior: answer
    trap_tags: [fiscal_calendar, shared_plant]
    required_kb_docs: [metrics/on_time_pgi_rate.md, concepts/fiscal_calendar.md, sites/dongguan.md]
    required_tables: [raw_sap_ecc.likp, raw_sap_ecc.t009b]
    notes: FY2026 P11 = 2026-08-24 to 2026-09-20; FY2025 P11 = 2025-08-25 to 2025-09-21.
    reference_sql: |
      SELECT ROUND(SUM(CASE WHEN wadat BETWEEN '20260824' AND '20260920' AND wadat_ist <> '00000000'
                                 AND wadat_ist <= wadat THEN 1 ELSE 0 END)
                   / SUM(CASE WHEN wadat BETWEEN '20260824' AND '20260920' THEN 1 ELSE 0 END), 4) AS rate_fy2026_p11,
             ROUND(SUM(CASE WHEN wadat BETWEEN '20250825' AND '20250921' AND wadat_ist <> '00000000'
                                 AND wadat_ist <= wadat THEN 1 ELSE 0 END)
                   / SUM(CASE WHEN wadat BETWEEN '20250825' AND '20250921' THEN 1 ELSE 0 END), 4) AS rate_fy2025_p11
      FROM raw_sap_ecc.likp
      WHERE vstel = 'C300'
    answer:
      values: [{column: rate_fy2026_p11, abs: 0.002}, {column: rate_fy2025_p11, abs: 0.002}]

  - id: c111
    split: test
    question: Which supplier country has had the best on-time delivery so far in fiscal year 2026, and what is its rate?
    role: ops_analyst_global
    category: multi_step
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [metric_definition, expedited_orders]
    required_kb_docs: [metrics/supplier_on_time_delivery.md, guides/procurement_and_stock.md]
    required_tables: [raw_sap_ecc.ekko, raw_sap_ecc.eket, raw_sap_ecc.mseg, raw_sap_ecc.lfa1]
    notes: Governed supplier OTD grouped by vendor country (LFA1.LAND1), both company codes.
    reference_sql: |
      WITH first_gr AS (
        SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
      )
      SELECT l.land1,
             ROUND(AVG(CASE WHEN g.first_receipt <= date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                            THEN 1.0 ELSE 0.0 END), 4) AS on_time_rate
      FROM raw_sap_ecc.ekko k
      JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
      JOIN first_gr g ON g.ebeln = k.ebeln
      JOIN raw_sap_ecc.lfa1 l ON l.lifnr = k.lifnr
      WHERE k.bsart = 'NB' AND g.first_receipt >= '20251027'
      GROUP BY l.land1
      ORDER BY on_time_rate DESC, l.land1
      LIMIT 1
    answer:
      keys: [land1]
      values: [{column: on_time_rate, abs: 0.005}]
