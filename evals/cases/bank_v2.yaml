  - id: c114
    question: On how many days during fiscal period 11 of FY2026 did Dongguan have no available stock of material 40001742?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    trap_tags: [snapshot_zero_rows, shared_plant]
    required_kb_docs: [concepts/stock_types.md, metrics/available_stock.md]
    required_tables: [raw_ext.inventory_snapshot_daily]
    notes: Days without a snapshot row count as zero stock (calendar anti-join), 2026-08-24 to 2026-09-20.
    reference_sql: |
      WITH days AS (SELECT explode(sequence(DATE'2026-08-24', DATE'2026-09-20')) AS d)
      SELECT COUNT(*) AS days_out_of_stock
      FROM days
      LEFT ANTI JOIN raw_ext.inventory_snapshot_daily s
        ON s.snapshot_date = days.d AND s.werks = 'CN10' AND s.lgort = '3000'
       AND ltrim('0', s.matnr) = '40001742' AND s.stock_category = 'UNRESTRICTED'
    answer:
      values: [{column: days_out_of_stock, abs: 0}]

