# Retired on 2026-10-17 (decision record 003: no external customers, no export control): c115.
# Evaluation bank v2: bank v1 plus 16 harder cases (c101-c116). Owner review pending.
#
# The new cases target rules that live only in the knowledge base (governed metric definitions, site
# shift times, hub demand, POD coverage), which the table and column documentation does not explain,
# and multi-step questions that chain a governed metric into a follow-up query. Same conventions as
# seed.yaml; about 40 % of the new cases are in the locked test split.

suite: bank_v2
as_of: "2026-09-21"  # Monday, first day of FY2026 P12; ECC extracted 2026-09-21 05:00 UTC
data_snapshot: {profile: small, generator_version: 0.8.0, seed: 20260924}
includes: [bank_v1]

cases:
  # ---------------------------------------------------------------- traps: knowledge-base-only rules
  - id: c101
    question: What is the on-time PGI rate at each site for the current fiscal quarter so far?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [data_freshness, fiscal_calendar, metric_definition]
    required_kb_docs: [metrics/on_time_pgi_rate.md, concepts/fiscal_calendar.md, concepts/data_freshness.md]
    required_tables: [raw_sap_ecc.likp, raw_sap_ecc.t009b]
    notes: >-
      FY2026 Q4 started 2026-07-27. Deliveries due before the cut-off day only (today, 2026-09-21, is
      excluded: most of today's deliveries are still open and would count as late); due-based, so open
      overdue deliveries count as late.
    reference_sql: |
      SELECT vstel,
             ROUND(SUM(CASE WHEN wadat_ist <> '00000000' AND wadat_ist <= wadat THEN 1 ELSE 0 END)
                   / COUNT(*), 4) AS on_time_pgi_rate
      FROM raw_sap_ecc.likp
      WHERE wadat BETWEEN '20260727' AND '20260920'
      GROUP BY vstel
    answer:
      keys: [vstel]
      values: [{column: on_time_pgi_rate, abs: 0.002}]

  - id: c102
    split: test
    question: How many Longgang materials have more than 180 days of supply?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [metric_definition, zero_demand]
    required_kb_docs: [metrics/days_of_supply.md, metrics/available_stock.md]
    required_tables: [raw_sap_ecc.mseg, raw_ext.inventory_snapshot_daily, raw_sap_ecc.mard]
    notes: >-
      Governed days of supply: available stock / trailing 28-day manufacturing demand. Materials without
      demand have undefined days of supply and are reported separately, not counted as infinite.
      As of the last complete day (snapshot 2026-09-20); current MARD stock is also accepted.
    reference_sql: |
      WITH demand AS (
        SELECT matnr, SUM(CASE WHEN bwart = '311' THEN menge ELSE -menge END) / 28.0 AS avg_daily_demand
        FROM raw_sap_ecc.mseg
        WHERE werks = 'CN10' AND lgort = '1000' AND umlgo = '2100'
          AND ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S'))
          AND budat_mkpf BETWEEN '20260824' AND '20260920'
        GROUP BY matnr
      ),
      stock AS (
        SELECT matnr, quantity
        FROM raw_ext.inventory_snapshot_daily
        WHERE snapshot_date = DATE'2026-09-20' AND werks = 'CN10' AND lgort = '1000'
          AND stock_category = 'UNRESTRICTED'
      )
      SELECT COUNT(*) AS materials_over_180_days
      FROM demand d LEFT JOIN stock s ON s.matnr = d.matnr
      WHERE d.avg_daily_demand > 0 AND COALESCE(s.quantity, 0) / d.avg_daily_demand > 180
    answer:
      values: [{column: materials_over_180_days, abs: 0}]
    answer_variants:
      - name: current_stock
        reference_sql: |
          WITH demand AS (
            SELECT matnr, SUM(CASE WHEN bwart = '311' THEN menge ELSE -menge END) / 28.0 AS avg_daily_demand
            FROM raw_sap_ecc.mseg
            WHERE werks = 'CN10' AND lgort = '1000' AND umlgo = '2100'
          AND ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S'))
              AND budat_mkpf BETWEEN '20260824' AND '20260920'
            GROUP BY matnr
          )
          SELECT COUNT(*) AS materials_over_180_days
          FROM demand d
          LEFT JOIN raw_sap_ecc.mard m ON m.matnr = d.matnr AND m.werks = 'CN10' AND m.lgort = '1000'
          WHERE d.avg_daily_demand > 0 AND COALESCE(m.labst, 0) / d.avg_daily_demand > 180
        answer:
          values: [{column: materials_over_180_days, abs: 0}]

