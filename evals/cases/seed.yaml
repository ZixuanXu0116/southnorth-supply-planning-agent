  - id: seed_13
    split: test
    question: What was the total value of goods issued to manufacturing in fiscal Q3 FY2026, net of reversals?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [currency, reversals, site_isolation]
    required_kb_docs: [concepts/goods_movements.md, policies/site_isolation.md, concepts/fiscal_calendar.md]
    required_tables: [raw_sap_ecc.mseg]
    notes: USD (US10) and CNY (CN10) must not be added; a per-plant (or per-site) breakdown is required.
    reference_sql: |
      SELECT werks, waers,
             SUM(CASE WHEN bwart = '311' THEN dmbtr ELSE -dmbtr END) AS net_gi_value
      FROM raw_sap_ecc.mseg
      WHERE ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S')) AND umlgo = '2100' AND budat_mkpf BETWEEN '20260427' AND '20260726'
      GROUP BY werks, waers
    answer:
      keys: [werks, waers]
      values: [{column: net_gi_value, rel: 0.001}]
    answer_variants:
      - name: per_site
        reference_sql: |
          SELECT CASE WHEN werks = 'US10' THEN 'U100' WHEN lgort = '1000' THEN 'C100' ELSE 'C300' END AS vstel,
                 waers,
                 SUM(CASE WHEN bwart = '311' THEN dmbtr ELSE -dmbtr END) AS net_gi_value
          FROM raw_sap_ecc.mseg
          WHERE ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S')) AND umlgo = '2100' AND budat_mkpf BETWEEN '20260427' AND '20260726'
          GROUP BY 1, waers
        answer:
          keys: [vstel, waers]
          values: [{column: net_gi_value, rel: 0.001}]
      - name: per_currency
        reference_sql: |
          SELECT waers, SUM(CASE WHEN bwart = '311' THEN dmbtr ELSE -dmbtr END) AS net_gi_value
          FROM raw_sap_ecc.mseg
          WHERE ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S')) AND umlgo = '2100' AND budat_mkpf BETWEEN '20260427' AND '20260726'
          GROUP BY waers
        answer:
          keys: [waers]
          values: [{column: net_gi_value, rel: 0.001}]

