  - id: seed_15
    split: test
    question: How many pieces did Dongguan ship in fiscal period 11 of FY2026?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    trap_tags: [units_of_measure, shared_plant]
    required_kb_docs: [concepts/units_of_measure.md, sites/dongguan.md, metrics/lines_shipped.md]
    required_tables: [raw_sap_ecc.lips, raw_sap_ecc.vbup, raw_sap_ecc.likp]
    notes: Sum the base-unit quantity (LGMNG). Summing LFIMG mixes BOX and EA and roughly halves the result.
    reference_sql: |
      SELECT SUM(p.lgmng) AS pieces_shipped
      FROM raw_sap_ecc.lips p
      JOIN raw_sap_ecc.vbup u ON u.vbeln = p.vbeln AND u.posnr = p.posnr
      JOIN raw_sap_ecc.likp k ON k.vbeln = p.vbeln
      WHERE u.wbsta = 'C' AND k.vstel = 'C300' AND k.wadat_ist BETWEEN '20260824' AND '20260920'
    answer:
      values: [{column: pieces_shipped, abs: 0}]

  - id: seed_16
    question: How many deliveries did each site ship yesterday?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [data_freshness, site_calendar]
    required_kb_docs: [concepts/data_freshness.md, policies/site_isolation.md]
    required_tables: [raw_sap_ecc.likp]
    notes: >-
      Yesterday = Sunday 2026-09-20 (site-local business date). Round Rock and Dongguan do not ship on
      Sundays, so near-zero counts are correct. The answer should state the data cut-off.
    reference_sql: |
      SELECT s.vstel, COUNT(l.vbeln) AS deliveries_shipped
      FROM (SELECT explode(array('U100', 'C100', 'C300')) AS vstel) s
      LEFT JOIN raw_sap_ecc.likp l ON l.vstel = s.vstel AND l.wadat_ist = '20260920'
      GROUP BY s.vstel
    answer:
      keys: [vstel]
      values: [{column: deliveries_shipped, abs: 0}]

