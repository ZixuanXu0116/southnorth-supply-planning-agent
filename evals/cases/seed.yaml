  - id: seed_20
    split: test
    question: How many pick tasks did each shift at Dongguan confirm in fiscal period 11 of FY2026? Exclude system users.
    role: site_manager_cn
    category: restricted
    expected_behavior: answer
    trap_tags: [system_users, people_analytics]
    required_kb_docs: [sites/dongguan.md, concepts/system_users.md, policies/people_analytics.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c, raw_ext.workforce_roster]
    notes: >-
      Allowed for the site manager (shift level, own site). Shifts come from the roster or from the local
      confirmation hour (A 07-15, B 15-23); both give nearly the same counts.
    reference_sql: |
      SELECT r.shift, COUNT(*) AS pick_tasks
      FROM raw_sap_ewm.scwm_ordim_c t
      JOIN raw_ext.workforce_roster r ON r.sap_uname = t.confirmed_by
      WHERE t.lgnum = 'DG01' AND t.tostat = 'C' AND t.procty IN ('2010', '2020')
        AND substr(cast(t.confirmed_at_wh AS STRING), 1, 8) BETWEEN '20260824' AND '20260920'
      GROUP BY r.shift
    answer:
      keys: [shift]
      values: [{column: pick_tasks, rel: 0.01}]
