# Retired on 2026-10-17 (decision record 003: no external customers, no export control): seed_06, seed_18.
# Seed evaluation cases (P0 baseline). Owner review pending.
#
# The agent never sees this file: it has no tool that reads evals/, and the data tools cannot read
# the eval schema. Expected results are computed from reference_sql by `snm-evals refresh` and stored
# in evals/answers/, bound to the data snapshot below.
#
# Fields
#   role                  agent role for the run
#   category              covered | adhoc | unfamiliar | trap | multi_step | investigation | clarify |
#                         decline | restricted
#   expected_behavior     answer | answer_with_assumption | clarify | decline | policy_restricted
#   acceptable_behaviors  behaviors that also pass routing (defaults to [expected_behavior])
#   answer                how the reference result is compared: key columns, value columns with
#                         tolerances (abs or rel), and whether row order matters
#   answer_variants       other correct presentations (e.g. per site instead of per plant)
#   required_kb_docs      documents a well-grounded run should read (paths relative to kb/)
#   trap_tags             traps the case exercises
#   split                 dev (iteration) or test (locked; run at milestones only); default dev

suite: seed
as_of: "2026-09-21"  # the agent is told that today is this date (Monday, first day of FY2026 P12)
data_snapshot: {profile: small, generator_version: 0.8.0, seed: 20260924}

cases:
  - id: seed_01
    question: What was the on-time PGI rate at each site in the last fiscal quarter?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [fiscal_calendar, site_isolation]
    required_kb_docs: [metrics/on_time_pgi_rate.md, concepts/fiscal_calendar.md, policies/site_isolation.md]
    required_tables: [raw_sap_ecc.likp, raw_sap_ecc.t009b]
    notes: Last fiscal quarter as of 2026-09-21 is FY2026 Q3 = 2026-04-27 to 2026-07-26.
    reference_sql: |
      SELECT vstel,
             ROUND(SUM(CASE WHEN wadat_ist <> '00000000' AND wadat_ist <= wadat THEN 1 ELSE 0 END)
                   / COUNT(*), 4) AS on_time_pgi_rate
      FROM raw_sap_ecc.likp
      WHERE wadat BETWEEN '20260427' AND '20260726'
      GROUP BY vstel
    answer:
      keys: [vstel]
      values: [{column: on_time_pgi_rate, abs: 0.002}]

  - id: seed_02
    question: How many delivery lines did Longgang ship in fiscal period 10 of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [reversals, fiscal_calendar]
    required_kb_docs: [metrics/lines_shipped.md, concepts/fiscal_calendar.md, sites/longgang.md]
    required_tables: [raw_sap_ecc.lips, raw_sap_ecc.vbup, raw_sap_ecc.likp]
    notes: FY2026 P10 = 2026-07-27 to 2026-08-23. Counting MSEG 601 lines overstates the result.
    reference_sql: |
      SELECT COUNT(*) AS lines_shipped
      FROM raw_sap_ecc.lips p
      JOIN raw_sap_ecc.vbup u ON u.vbeln = p.vbeln AND u.posnr = p.posnr
      JOIN raw_sap_ecc.likp k ON k.vbeln = p.vbeln
      WHERE u.wbsta = 'C' AND k.vstel = 'C100' AND k.wadat_ist BETWEEN '20260727' AND '20260823'
    answer:
      values: [{column: lines_shipped, abs: 0}]

  - id: seed_03
    split: test
    question: What was the median pick cycle time in each warehouse during fiscal period 11 of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [timezone, cancelled_tasks]
    required_kb_docs: [metrics/pick_cycle_time.md, concepts/fiscal_calendar.md, concepts/time_zones.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c]
    notes: >-
      FY2026 P11 = 2026-08-24 to 2026-09-20 by site-local confirmation date. Default variant is
      creation to confirmation; the execution-time variant (start to confirmation) is a different metric.
    reference_sql: |
      SELECT lgnum,
             percentile((unix_timestamp(to_timestamp(cast(confirmed_at AS STRING), 'yyyyMMddHHmmss'))
                        - unix_timestamp(to_timestamp(cast(created_at AS STRING), 'yyyyMMddHHmmss'))) / 60.0,
                        0.5) AS median_minutes
      FROM raw_sap_ewm.scwm_ordim_c
      WHERE tostat = 'C' AND procty IN ('2010', '2020')
        AND substr(cast(confirmed_at_wh AS STRING), 1, 8) BETWEEN '20260824' AND '20260920'
      GROUP BY lgnum
    answer:
      keys: [lgnum]
      values: [{column: median_minutes, rel: 0.03, unit: minutes}]

  - id: seed_04
    question: >-
      What was the median time from wave release to goods issue for Dongguan deliveries shipped in
      fiscal period 11 of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [timezone, cross_system_join, reversals]
    required_kb_docs: [metrics/wave_to_pgi_lead_time.md, concepts/time_zones.md, guides/outbound_flow.md]
    required_tables: [raw_sap_ewm.scwm_wavehdr, raw_sap_ewm.scwm_ordim_c, raw_sap_ewm.scdl_db_refdoc,
                      raw_sap_ecc.mkpf, raw_sap_ecc.mseg, raw_sap_ecc.likp, raw_sap_ecc.vbuk]
    notes: >-
      Wave release is UTC (EWM); goods issue entry time is America/Chicago (ECC). Deliveries are assigned
      to the period by actual goods issue date (WADAT_IST).
    reference_sql: |
      WITH delivery_wave AS (
        SELECT DISTINCT r.refdocno AS vbeln, t.lgnum, t.wave
        FROM raw_sap_ewm.scdl_db_refdoc r
        JOIN raw_sap_ewm.scwm_ordim_c t ON t.rdocid = r.docid AND t.ritmid = r.itemid
        WHERE t.tostat = 'C'
      ),
      final_gi AS (
        SELECT m.le_vbeln AS vbeln,
               MAX(to_utc_timestamp(to_timestamp(concat(m.cpudt, m.cputm), 'yyyyMMddHHmmss'),
                                    'America/Chicago')) AS gi_utc
        FROM raw_sap_ecc.mkpf m
        JOIN raw_sap_ecc.mseg s ON s.mblnr = m.mblnr AND s.mjahr = m.mjahr AND s.zeile = '0001'
        WHERE s.bwart = '311'
        GROUP BY m.le_vbeln
      )
      SELECT percentile((unix_timestamp(g.gi_utc)
                         - unix_timestamp(to_timestamp(cast(h.released_at AS STRING), 'yyyyMMddHHmmss'))) / 60.0,
                        0.5) AS median_minutes
      FROM delivery_wave w
      JOIN raw_sap_ewm.scwm_wavehdr h ON h.lgnum = w.lgnum AND h.wave = w.wave
      JOIN final_gi g ON g.vbeln = w.vbeln
      JOIN raw_sap_ecc.vbuk k ON k.vbeln = w.vbeln AND k.wbstk = 'C'
      JOIN raw_sap_ecc.likp l ON l.vbeln = w.vbeln
      WHERE l.vstel = 'C300' AND l.wadat_ist BETWEEN '20260824' AND '20260920'
    answer:
      values: [{column: median_minutes, rel: 0.03, unit: minutes}]

  - id: seed_05
    split: test
    question: >-
      For POD-relevant deliveries with a planned delivery date in fiscal period 11 of FY2026, what was
      the on-time delivery rate per site, and how many of them are still waiting for proof of delivery?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [pod_relevance, data_freshness]
    required_kb_docs: [metrics/otd_pod.md, concepts/fiscal_calendar.md, policies/site_isolation.md]
    required_tables: [raw_sap_ecc.likp, raw_sap_ecc.vbuk]
    notes: Pending deliveries are reported separately and excluded from the rate denominator.
    reference_sql: |
      SELECT l.vstel,
             ROUND(SUM(CASE WHEN l.podat <> '00000000' AND l.podat <= l.lfdat THEN 1 ELSE 0 END)
                   / SUM(CASE WHEN l.podat <> '00000000' THEN 1 ELSE 0 END), 4) AS otd_rate,
             SUM(CASE WHEN l.podat = '00000000' THEN 1 ELSE 0 END) AS pending_pod
      FROM raw_sap_ecc.likp l
      JOIN raw_sap_ecc.vbuk k ON k.vbeln = l.vbeln
      WHERE k.pdstk <> '' AND l.lfdat BETWEEN '20260824' AND '20260920'
      GROUP BY l.vstel
    answer:
      keys: [vstel]
      values: [{column: otd_rate, abs: 0.002}, {column: pending_pod, abs: 0}]

  - id: seed_07
    split: test
    question: Which five materials had the highest shipped quantity from Dongguan in fiscal Q3 FY2026?
    role: ops_analyst_global
    category: adhoc
    expected_behavior: answer
    trap_tags: [units_of_measure, shared_plant, material_numbers]
    required_kb_docs: [concepts/units_of_measure.md, sites/dongguan.md, metrics/lines_shipped.md]
    required_tables: [raw_sap_ecc.lips, raw_sap_ecc.vbup, raw_sap_ecc.likp]
    notes: >-
      Quantities in base unit (LGMNG, EA). Dongguan shares plant CN10 with Longgang; filter by shipping
      point C300 or storage location 3000.
    reference_sql: |
      SELECT ltrim('0', p.matnr) AS material, SUM(p.lgmng) AS shipped_qty_ea
      FROM raw_sap_ecc.lips p
      JOIN raw_sap_ecc.vbup u ON u.vbeln = p.vbeln AND u.posnr = p.posnr
      JOIN raw_sap_ecc.likp k ON k.vbeln = p.vbeln
      WHERE u.wbsta = 'C' AND k.vstel = 'C300' AND k.wadat_ist BETWEEN '20260427' AND '20260726'
      GROUP BY p.matnr
      ORDER BY shipped_qty_ea DESC, material
      LIMIT 5
    answer:
      keys: [material]
      values: [{column: shipped_qty_ea, abs: 0}]
      order_matters: true

