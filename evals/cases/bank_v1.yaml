  - id: c082
    split: test
    question: How many outbound deliveries were created for the Dongguan warehouse today?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer_with_assumption
    acceptable_behaviors: [answer_with_assumption, answer]
    trap_tags: [data_freshness, cross_system_join, timezone]
    required_kb_docs: [concepts/data_freshness.md, concepts/time_zones.md]
    required_tables: [raw_sap_ewm.scdl_db_proch_o, raw_sap_ecc.likp]
    notes: >-
      ECC (nightly, 05:00 UTC) has none for today yet; EWM (hourly, to 14:00 UTC) has the delivery orders
      created so far today (local date, UTC+8). The answer must state the EWM cut-off.
    reference_sql: |
      SELECT COUNT(*) AS deliveries_created
      FROM raw_sap_ewm.scdl_db_proch_o
      WHERE lgnum = 'DG01' AND doccat = 'PDO'
        AND to_date(from_utc_timestamp(to_timestamp(cast(cretst AS STRING), 'yyyyMMddHHmmss'), 'Asia/Shanghai'))
            = DATE'2026-09-21'
    answer:
      values: [{column: deliveries_created, abs: 0}]

  - id: c083
    question: What share of the stock transfers from Longgang to Dongguan in fiscal year 2026 so far were emergency transfers?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
