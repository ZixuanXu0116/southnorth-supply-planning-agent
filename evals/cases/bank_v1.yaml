  - id: c026
    question: >-
      What were the median and the 90th-percentile pick cycle times at Round Rock in fiscal period 10
      of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [timezone, cancelled_tasks]
    required_kb_docs: [metrics/pick_cycle_time.md, concepts/fiscal_calendar.md, concepts/time_zones.md]
