    split: test
    question: What was the value of the inventory held at Dongguan at the end of 2026-09-13?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [historical_stock, stock_in_transfer, shared_plant, currency]
    required_kb_docs: [concepts/stock_types.md, sites/dongguan.md]
    required_tables: [raw_ext.inventory_snapshot_daily]
    notes: >-
      A past date needs the daily snapshot (MARD is today's stock). Own stock at 3000 includes stock in
      transfer; unrestricted only is also accepted. Values in CNY.
    reference_sql: |
      SELECT ROUND(SUM(stock_value), 2) AS stock_value_cny
      FROM raw_ext.inventory_snapshot_daily
      WHERE snapshot_date = DATE'2026-09-13' AND werks = 'CN10' AND lgort = '3000'
    answer:
      values: [{column: stock_value_cny, rel: 0.002}]
    answer_variants:
      - name: unrestricted_only
        reference_sql: |
          SELECT ROUND(SUM(stock_value), 2) AS stock_value_cny
          FROM raw_ext.inventory_snapshot_daily
          WHERE snapshot_date = DATE'2026-09-13' AND werks = 'CN10' AND lgort = '3000'
            AND stock_category = 'UNRESTRICTED'
        answer:
          values: [{column: stock_value_cny, rel: 0.002}]

  - id: c073
    question: >-
      How many of the materials Dongguan issued to manufacturing during fiscal period 11 of FY2026 were out of stock there
      at the end of 2026-09-20?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [snapshot_zero_rows, shared_plant]
    required_kb_docs: [concepts/stock_types.md, metrics/available_stock.md]
    required_tables: [raw_sap_ecc.mseg, raw_ext.inventory_snapshot_daily]
    notes: The snapshot has no rows for zero stock; an anti-join is needed (a filter on quantity = 0 finds none).
    reference_sql: |
      WITH sold AS (
        SELECT matnr
        FROM raw_sap_ecc.mseg
        WHERE werks = 'CN10' AND lgort = '3000' AND umlgo = '2100'
          AND ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S'))
          AND budat_mkpf BETWEEN '20260824' AND '20260920'
        GROUP BY matnr
        HAVING SUM(CASE WHEN bwart = '311' THEN menge ELSE -menge END) > 0
      )
      SELECT COUNT(*) AS out_of_stock_materials
      FROM sold s
      LEFT ANTI JOIN raw_ext.inventory_snapshot_daily d
        ON d.matnr = s.matnr AND d.snapshot_date = DATE'2026-09-20' AND d.werks = 'CN10'
       AND d.lgort = '3000' AND d.stock_category = 'UNRESTRICTED'
    answer:
      values: [{column: out_of_stock_materials, abs: 0}]

  - id: c074
    split: test
    question: How many emergency stock transfers from Longgang to Dongguan were posted in fiscal period 11 of FY2026?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    trap_tags: [transfer_double_count, system_users]
    required_kb_docs: [concepts/internal_transfers.md, concepts/system_users.md]
    required_tables: [raw_sap_ecc.mseg, raw_sap_ecc.mkpf]
    notes: Emergency = 313 posted by RFC-EWM; count material documents, not the two items of each.
    reference_sql: |
      SELECT COUNT(DISTINCT m.mblnr) AS emergency_transfers
      FROM raw_sap_ecc.mkpf m
      JOIN raw_sap_ecc.mseg s ON s.mblnr = m.mblnr AND s.mjahr = m.mjahr
      WHERE s.bwart = '313' AND m.usnam = 'RFC-EWM' AND m.budat BETWEEN '20260824' AND '20260920'
    answer:
      values: [{column: emergency_transfers, abs: 0}]

  - id: c075
    question: What was the value of goods received from suppliers in fiscal Q3 of FY2026?
