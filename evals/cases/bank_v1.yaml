  - id: c035
    question: How many days of supply does each site have for material 40000481, as of the end of 2026-09-20?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [satellites, shared_plant, transfers_not_demand]
    required_kb_docs: [metrics/days_of_supply.md, metrics/available_stock.md]
    required_tables: [raw_sap_ecc.mseg, raw_ext.inventory_snapshot_daily]
    reference_sql: |
      WITH site_map AS (
        SELECT 'US10' AS werks, '1000' AS lgort, 'U100' AS vstel UNION ALL
        SELECT 'CN10', '1000', 'C100' UNION ALL
        SELECT 'CN10', '3000', 'C300'
      ),
      demand AS (
        SELECT werks, lgort, SUM(CASE WHEN bwart = '311' THEN menge ELSE -menge END) / 28.0 AS avg_daily_demand
        FROM raw_sap_ecc.mseg
        WHERE ltrim('0', matnr) = '40000481' AND umlgo = '2100'
          AND ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S'))
          AND budat_mkpf BETWEEN '20260824' AND '20260920'
        GROUP BY werks, lgort
      ),
      stock AS (
        SELECT werks, lgort, quantity
        FROM raw_ext.inventory_snapshot_daily
        WHERE snapshot_date = DATE'2026-09-20' AND ltrim('0', matnr) = '40000481'
          AND stock_category = 'UNRESTRICTED'
      )
      SELECT m.vstel, ROUND(COALESCE(s.quantity, 0) / d.avg_daily_demand, 2) AS days_of_supply
      FROM site_map m
      JOIN demand d ON d.werks = m.werks AND d.lgort = m.lgort
      LEFT JOIN stock s ON s.werks = m.werks AND s.lgort = m.lgort
      WHERE d.avg_daily_demand > 0
    answer:
      keys: [vstel]
      values: [{column: days_of_supply, rel: 0.03, unit: days}]

  - id: c036
    question: What was the supplier on-time delivery rate for each company code in fiscal Q3 of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [expedited_orders, fiscal_calendar]
    required_kb_docs: [metrics/supplier_on_time_delivery.md, guides/procurement_and_stock.md]
    required_tables: [raw_sap_ecc.ekko, raw_sap_ecc.ekpo, raw_sap_ecc.eket, raw_sap_ecc.mseg]
    notes: Standard POs (NB) by first-receipt date in 2026-04-27 to 2026-07-26; one day of grace.
    reference_sql: |
      WITH first_gr AS (
        SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
      )
      SELECT k.bukrs,
             ROUND(AVG(CASE WHEN g.first_receipt <= date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                            THEN 1.0 ELSE 0.0 END), 4) AS on_time_rate
      FROM raw_sap_ecc.ekko k
      JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
      JOIN first_gr g ON g.ebeln = k.ebeln
      WHERE k.bsart = 'NB' AND g.first_receipt BETWEEN '20260427' AND '20260726'
      GROUP BY k.bukrs
    answer:
      keys: [bukrs]
      values: [{column: on_time_rate, abs: 0.005}]
    answer_variants:
      - name: per_plant
        reference_sql: |
          WITH first_gr AS (
            SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
          )
          SELECT p.werks,
                 ROUND(AVG(CASE WHEN g.first_receipt <= date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                                THEN 1.0 ELSE 0.0 END), 4) AS on_time_rate
          FROM raw_sap_ecc.ekko k
          JOIN raw_sap_ecc.ekpo p ON p.ebeln = k.ebeln
          JOIN raw_sap_ecc.eket e ON e.ebeln = p.ebeln AND e.ebelp = p.ebelp
          JOIN first_gr g ON g.ebeln = k.ebeln
          WHERE k.bsart = 'NB' AND g.first_receipt BETWEEN '20260427' AND '20260726'
          GROUP BY p.werks
        answer:
          keys: [werks]
          values: [{column: on_time_rate, abs: 0.005}]

  - id: c037
    split: test
    question: >-
      Which three suppliers have had the lowest on-time delivery rate so far in fiscal year 2026? Give
      their names and rates.
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [expedited_orders, fiscal_calendar]
    required_kb_docs: [metrics/supplier_on_time_delivery.md, guides/procurement_and_stock.md]
    required_tables: [raw_sap_ecc.ekko, raw_sap_ecc.eket, raw_sap_ecc.mseg, raw_sap_ecc.lfa1]
    notes: Both company codes together, per vendor; first receipt from 2025-10-27.
    reference_sql: |
      WITH first_gr AS (
        SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
      )
      SELECT l.name1,
             ROUND(AVG(CASE WHEN g.first_receipt <= date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                            THEN 1.0 ELSE 0.0 END), 4) AS on_time_rate
      FROM raw_sap_ecc.ekko k
      JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
      JOIN first_gr g ON g.ebeln = k.ebeln
      JOIN raw_sap_ecc.lfa1 l ON l.lifnr = k.lifnr
      WHERE k.bsart = 'NB' AND g.first_receipt >= '20251027'
      GROUP BY l.name1
      ORDER BY on_time_rate, l.name1
      LIMIT 3
    answer:
      keys: [name1]
      values: [{column: on_time_rate, abs: 0.005}]
      order_matters: true

  - id: c038
    question: What was Lindmark Sensorik's on-time delivery rate in fiscal period 10 of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [expedited_orders]
    required_kb_docs: [metrics/supplier_on_time_delivery.md, guides/procurement_and_stock.md]
    required_tables: [raw_sap_ecc.ekko, raw_sap_ecc.eket, raw_sap_ecc.mseg, raw_sap_ecc.lfa1]
    notes: The vendor supplies both company codes; the overall rate or a per-company-code breakdown passes.
    reference_sql: |
      WITH first_gr AS (
        SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
      )
      SELECT ROUND(AVG(CASE WHEN g.first_receipt <= date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                            THEN 1.0 ELSE 0.0 END), 4) AS on_time_rate
      FROM raw_sap_ecc.ekko k
      JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
      JOIN first_gr g ON g.ebeln = k.ebeln
      JOIN raw_sap_ecc.lfa1 l ON l.lifnr = k.lifnr
      WHERE k.bsart = 'NB' AND l.name1 = 'Lindmark Sensorik'
        AND g.first_receipt BETWEEN '20260727' AND '20260823'
    answer:
      values: [{column: on_time_rate, abs: 0.005}]
    answer_variants:
      - name: per_company_code
        reference_sql: |
          WITH first_gr AS (
            SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
          )
          SELECT k.bukrs,
                 ROUND(AVG(CASE WHEN g.first_receipt <= date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                                THEN 1.0 ELSE 0.0 END), 4) AS on_time_rate
          FROM raw_sap_ecc.ekko k
          JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
          JOIN first_gr g ON g.ebeln = k.ebeln
          JOIN raw_sap_ecc.lfa1 l ON l.lifnr = k.lifnr
          WHERE k.bsart = 'NB' AND l.name1 = 'Lindmark Sensorik'
            AND g.first_receipt BETWEEN '20260727' AND '20260823'
          GROUP BY k.bukrs
        answer:
          keys: [bukrs]
          values: [{column: on_time_rate, abs: 0.005}]

