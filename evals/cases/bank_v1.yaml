    reference_sql: |
      SELECT percentile(d, 0.5) AS median_minutes, percentile(d, 0.9) AS p90_minutes
      FROM (
        SELECT (unix_timestamp(to_timestamp(cast(confirmed_at AS STRING), 'yyyyMMddHHmmss'))
