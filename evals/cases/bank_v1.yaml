  - id: c078
    split: test
    question: What was Dongguan's on-time PGI rate in the first week of fiscal year 2026?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    trap_tags: [fiscal_calendar, shared_plant]
    required_kb_docs: [metrics/on_time_pgi_rate.md, concepts/fiscal_calendar.md, sites/dongguan.md]
    required_tables: [raw_sap_ecc.likp, raw_sap_ecc.t009b]
    notes: Fiscal week 1 of FY2026 = 2025-10-27 to 2025-11-02 (not the first week of calendar 2026 or of October).
    reference_sql: |
      SELECT ROUND(SUM(CASE WHEN wadat_ist <> '00000000' AND wadat_ist <= wadat THEN 1 ELSE 0 END)
                   / COUNT(*), 4) AS on_time_pgi_rate
      FROM raw_sap_ecc.likp
      WHERE vstel = 'C300' AND wadat BETWEEN '20251027' AND '20251102'
    answer:
      values: [{column: on_time_pgi_rate, abs: 0.002}]

  - id: c079
    question: How many pieces did Dongguan ship in fiscal Q2 of FY2026?
    role: ops_analyst_global
    category: trap
    expected_behavior: answer
    trap_tags: [units_of_measure, shared_plant, fiscal_calendar]
    required_kb_docs: [concepts/units_of_measure.md, sites/dongguan.md, concepts/fiscal_calendar.md]
    required_tables: [raw_sap_ecc.lips, raw_sap_ecc.vbup, raw_sap_ecc.likp, raw_sap_ecc.t009b]
    notes: FY2026 Q2 = 2026-01-26 to 2026-04-26. Base-unit quantity (LGMNG), shipping point C300.
    reference_sql: |
      SELECT SUM(p.lgmng) AS pieces_shipped
      FROM raw_sap_ecc.lips p
      JOIN raw_sap_ecc.vbup u ON u.vbeln = p.vbeln AND u.posnr = p.posnr
      JOIN raw_sap_ecc.likp k ON k.vbeln = p.vbeln
      WHERE u.wbsta = 'C' AND k.vstel = 'C300' AND k.wadat_ist BETWEEN '20260126' AND '20260426'
    answer:
      values: [{column: pieces_shipped, abs: 0}]

