  - id: c028
    question: >-
      What was the median wave-to-PGI lead time in each warehouse for deliveries shipped in fiscal
      period 10 of FY2026?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    trap_tags: [timezone, cross_system_join, reversals]
    required_kb_docs: [metrics/wave_to_pgi_lead_time.md, concepts/time_zones.md, guides/outbound_flow.md]
    required_tables: [raw_sap_ewm.scwm_wavehdr, raw_sap_ewm.scwm_ordim_c, raw_sap_ewm.scdl_db_refdoc,
                      raw_sap_ecc.mkpf, raw_sap_ecc.mseg, raw_sap_ecc.likp, raw_sap_ecc.vbuk, raw_sap_ecc.t009b]
    reference_sql: |
      WITH delivery_wave AS (
        SELECT DISTINCT r.refdocno AS vbeln, t.lgnum, t.wave
        FROM raw_sap_ewm.scdl_db_refdoc r
        JOIN raw_sap_ewm.scwm_ordim_c t ON t.rdocid = r.docid AND t.ritmid = r.itemid
        WHERE t.tostat = 'C'
      ),
      final_gi AS (
        SELECT m.le_vbeln AS vbeln,
               MAX(to_utc_timestamp(to_timestamp(concat(m.cpudt, m.cputm), 'yyyyMMddHHmmss'),
                                    'America/Chicago')) AS gi_utc
        FROM raw_sap_ecc.mkpf m
        JOIN raw_sap_ecc.mseg s ON s.mblnr = m.mblnr AND s.mjahr = m.mjahr AND s.zeile = '0001'
        WHERE s.bwart = '311'
        GROUP BY m.le_vbeln
      )
      SELECT w.lgnum,
             percentile((unix_timestamp(g.gi_utc)
                         - unix_timestamp(to_timestamp(cast(h.released_at AS STRING), 'yyyyMMddHHmmss'))) / 60.0,
                        0.5) AS median_minutes
      FROM delivery_wave w
      JOIN raw_sap_ewm.scwm_wavehdr h ON h.lgnum = w.lgnum AND h.wave = w.wave
      JOIN final_gi g ON g.vbeln = w.vbeln
      JOIN raw_sap_ecc.vbuk k ON k.vbeln = w.vbeln AND k.wbstk = 'C'
      JOIN raw_sap_ecc.likp l ON l.vbeln = w.vbeln
      WHERE l.wadat_ist BETWEEN '20260727' AND '20260823'
      GROUP BY w.lgnum
    answer:
      keys: [lgnum]
      values: [{column: median_minutes, rel: 0.03, unit: minutes}]

