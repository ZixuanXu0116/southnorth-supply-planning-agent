  - id: c033
    question: >-
      What was the median days of supply across the materials Longgang issues to manufacturing, as of the end of
      2026-09-20?
    role: ops_analyst_global
    category: covered
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [stock_types, transfers_not_demand]
    required_kb_docs: [metrics/days_of_supply.md, metrics/available_stock.md]
    required_tables: [raw_sap_ecc.mseg, raw_ext.inventory_snapshot_daily]
    notes: Materials with demand in the trailing 28 days; zero stock counts as 0 days.
    reference_sql: |
      WITH demand AS (
        SELECT matnr, SUM(CASE WHEN bwart = '311' THEN menge ELSE -menge END) / 28.0 AS avg_daily_demand
        FROM raw_sap_ecc.mseg
        WHERE werks = 'CN10' AND lgort = '1000' AND umlgo = '2100'
          AND ((bwart = '311' AND shkzg = 'H') OR (bwart = '312' AND shkzg = 'S'))
          AND budat_mkpf BETWEEN '20260824' AND '20260920'
        GROUP BY matnr
      ),
      stock AS (
        SELECT matnr, quantity
        FROM raw_ext.inventory_snapshot_daily
        WHERE snapshot_date = DATE'2026-09-20' AND werks = 'CN10' AND lgort = '1000'
          AND stock_category = 'UNRESTRICTED'
      )
      SELECT percentile(COALESCE(s.quantity, 0) / d.avg_daily_demand, 0.5) AS median_days_of_supply
      FROM demand d LEFT JOIN stock s ON s.matnr = d.matnr
      WHERE d.avg_daily_demand > 0
    answer:
      values: [{column: median_days_of_supply, rel: 0.05, unit: days}]

  - id: c034
    split: test
    question: How many materials at Dongguan had less than one week of supply left at the end of 2026-09-20?
    role: ops_analyst_global
    category: covered
