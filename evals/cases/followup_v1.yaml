  - id: f13
    turns:
      - question: What was the supplier on-time delivery rate for each company code in fiscal Q3 of FY2026?
        expected_behavior: answer
      - question: Which supplier has had the lowest on-time rate so far this fiscal year?
        expected_behavior: answer
        acceptable_behaviors: [answer, answer_with_assumption]
    question: How many of its purchase order schedule lines are still open, and how many of those are overdue?
    role: ops_analyst_global
    category: followup
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [context_carryover, metric_definition]
    required_kb_docs: [metrics/supplier_on_time_delivery.md, guides/procurement_and_stock.md]
    required_tables: [raw_sap_ecc.ekko, raw_sap_ecc.eket, raw_sap_ecc.mseg, raw_sap_ecc.lfa1]
    notes: >-
      Same computation as bank case c105, split into a thread. Governed supplier on-time delivery: standard
      POs (NB) by first-receipt date from 2025-10-27, one day of grace. Open = received below ordered;
      overdue = open with a delivery date before 2026-09-21.
    reference_sql: |
      WITH first_gr AS (
        SELECT ebeln, MIN(budat_mkpf) AS first_receipt FROM raw_sap_ecc.mseg WHERE bwart = '101' GROUP BY ebeln
      ),
      worst AS (
        SELECT k.lifnr
        FROM raw_sap_ecc.ekko k
        JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
        JOIN first_gr g ON g.ebeln = k.ebeln
        WHERE k.bsart = 'NB' AND g.first_receipt >= '20251027'
        GROUP BY k.lifnr
        ORDER BY AVG(CASE WHEN g.first_receipt <= date_format(date_add(to_date(e.eindt, 'yyyyMMdd'), 1), 'yyyyMMdd')
                          THEN 1.0 ELSE 0.0 END)
        LIMIT 1
      )
      SELECT l.name1,
             SUM(CASE WHEN e.wemng < e.menge THEN 1 ELSE 0 END) AS open_lines,
             SUM(CASE WHEN e.wemng < e.menge AND e.eindt < '20260921' THEN 1 ELSE 0 END) AS overdue_lines
      FROM worst w
      JOIN raw_sap_ecc.lfa1 l ON l.lifnr = w.lifnr
      JOIN raw_sap_ecc.ekko k ON k.lifnr = w.lifnr
      JOIN raw_sap_ecc.eket e ON e.ebeln = k.ebeln
      GROUP BY l.name1
    answer:
      keys: [name1]
      values: [{column: open_lines, abs: 0}, {column: overdue_lines, abs: 0}]
