  - id: f11
    turns:
      - question: What was the AutoStore system availability at Longgang in fiscal period 11 of FY2026?
        expected_behavior: answer
        acceptable_behaviors: [answer, answer_with_assumption]
      - question: How many times did it stop in that period?
        expected_behavior: answer
    question: When was the last stop before that period, how long did it last, and why?
    role: ops_analyst_global
    category: followup
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [context_carryover, timezone]
    required_kb_docs: [metrics/autostore_availability.md, guides/autostore.md]
    required_tables: [raw_ext.autostore_system_status]
    notes: >-
      No stop started in P11 (2026-08-24..09-20 Longgang local), so the second answer is zero and availability
      is 100 %. The last stop before it began on 2026-08-07 (robot fault, about 18 minutes).
    reference_sql: |
      SELECT ROUND((unix_timestamp(ended_at) - unix_timestamp(started_at)) / 60.0, 1) AS stop_minutes
      FROM raw_ext.autostore_system_status
      WHERE started_at < TIMESTAMP_NTZ'2026-08-24 00:00:00'
      ORDER BY started_at DESC
      LIMIT 1
    answer:
      values: [{column: stop_minutes, abs: 1, unit: minutes}]
      must_mention: [[ROBOT_FAULT, robot fault], [August 7, Aug 7, 7 August, "2026-08-07", "08-07"]]

