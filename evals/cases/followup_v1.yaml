# Follow-up threads v1 (decision record 006): each case is a thread of questions asked in one session.
# `turns` are the earlier questions, scored on behavior only; `question` is the last one, scored like any
# other case (behavior, and values against `reference_sql`, which computes the last answer standalone).
# The first three threads were written with the owner on 2026-10-19 (EVAL_GUIDE.md §8 authoring exercise):
# one of the owner's choice (f01), one trap (f02), one negative case (f03). Threads f04-f13 were drafted by the
# assistant from dev cases of the banks and wait for the owner's review.

suite: followup_v1
as_of: "2026-09-21"  # Monday, first day of FY2026 P12
data_snapshot: {profile: small, generator_version: 0.8.0, seed: 20260924}

# Fiscal periods of FY2026 used below: Q3 2026-04-27..07-26 (P9 06-22..07-26), P10 07-27..08-23, P11 08-24..09-20.

cases:
  - id: f01
    turns:
      - question: How many delivery lines did Longgang ship in fiscal period 10 of FY2026?
        expected_behavior: answer
      - question: And Dongguan?
        expected_behavior: answer
    question: Same for period 11, both sites side by side.
    role: ops_analyst_global
    category: followup
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [context_carryover, fiscal_calendar, reversals, shared_plant]
    required_kb_docs: [metrics/lines_shipped.md, concepts/fiscal_calendar.md, sites/dongguan.md]
    required_tables: [raw_sap_ecc.lips, raw_sap_ecc.vbup, raw_sap_ecc.likp]
    notes: >-
      The last question carries the metric (lines shipped, reversals excluded) from the first and the sites
      from the first two, and changes the period to P11 = 2026-08-24..09-20. Dongguan shares plant CN10 with
      Longgang, so the sites are split by shipping point (C100, C300), never by plant.
    reference_sql: |
      SELECT k.vstel, COUNT(*) AS lines_shipped
      FROM raw_sap_ecc.lips p
      JOIN raw_sap_ecc.vbup u ON u.vbeln = p.vbeln AND u.posnr = p.posnr
      JOIN raw_sap_ecc.likp k ON k.vbeln = p.vbeln
      WHERE u.wbsta = 'C' AND k.vstel IN ('C100', 'C300') AND k.wadat_ist BETWEEN '20260824' AND '20260920'
      GROUP BY k.vstel
    answer:
      keys: [vstel]
      values: [{column: lines_shipped, abs: 0}]

  - id: f02
    turns:
      - question: How many pick tasks were confirmed at Longgang on September 16, 2026?
        expected_behavior: answer
      - question: What was the median cycle time for those?
        expected_behavior: answer
        acceptable_behaviors: [answer, answer_with_assumption]
    question: How does Round Rock compare on the same day?
    role: ops_analyst_global
    category: followup
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [context_carryover, timezone, cancelled_tasks]
    required_kb_docs: [metrics/pick_cycle_time.md, concepts/time_zones.md, sites/round_rock.md]
    required_tables: [raw_sap_ewm.scwm_ordim_c]
    notes: >-
      "Those" are the confirmed pick tasks of the first question; "the same day" is 2026-09-16 in each site's
      local time (CONFIRMED_AT_WH): Asia/Shanghai for Longgang, America/Chicago for Round Rock, never the UTC
      day or the Longgang day carried over. Default cycle-time variant: creation to confirmation. The owner's
      draft used September 15, when Round Rock confirmed no pick tasks; moved to September 16 (Wednesday).
    reference_sql: |
      SELECT lgnum,
             percentile((unix_timestamp(to_timestamp(cast(confirmed_at AS STRING), 'yyyyMMddHHmmss'))
                        - unix_timestamp(to_timestamp(cast(created_at AS STRING), 'yyyyMMddHHmmss'))) / 60.0,
                        0.5) AS median_minutes
      FROM raw_sap_ewm.scwm_ordim_c
      WHERE lgnum IN ('SZ01', 'RR01') AND tostat = 'C' AND procty IN ('2010', '2020')
        AND substr(cast(confirmed_at_wh AS STRING), 1, 8) = '20260916'
      GROUP BY lgnum
    answer:
      keys: [lgnum]
      values: [{column: median_minutes, rel: 0.03, unit: minutes}]

  - id: f03
    turns:
      - question: How many pick tasks did Dongguan confirm in fiscal period 11 of FY2026?
        expected_behavior: answer
      - question: Now break it down by shift, without system users.
        expected_behavior: answer
        acceptable_behaviors: [answer, answer_with_assumption]
    question: How does that compare with Round Rock?
    role: site_manager_cn
    category: followup
    expected_behavior: policy_restricted
    trap_tags: [context_carryover, site_isolation]
    required_kb_docs: [policies/site_isolation.md]
    required_tables: []
    notes: >-
      The China site manager sees Longgang and Dongguan only. The conversation flows into Round Rock: the
      agent must say it cannot show Round Rock data (an empty filtered result is not zero) and may repeat the
      Dongguan figures.

  # ---------------------------------------------------------------- threads f04-f13 (assistant drafts, owner review)
  - id: f04
    turns:
      - question: What was the on-time PGI rate for each site in fiscal period 9 of FY2026?
        expected_behavior: answer
      - question: And in period 10?
        expected_behavior: answer
    question: Which site improved the most from period 9 to period 10, and by how many points?
    role: ops_analyst_global
    category: followup
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [context_carryover, fiscal_calendar]
    required_kb_docs: [metrics/on_time_pgi_rate.md, concepts/fiscal_calendar.md]
    required_tables: [raw_sap_ecc.likp]
    notes: >-
      P9 = 2026-06-22..07-26 (five weeks), P10 = 2026-07-27..08-23; due-based (WADAT). The last answer compares
      the two earlier results; the reference gives the change per site, so every site's change is checked.
    reference_sql: |
      SELECT vstel,
             ROUND(AVG(CASE WHEN wadat BETWEEN '20260727' AND '20260823'
                            THEN CASE WHEN wadat_ist <> '00000000' AND wadat_ist <= wadat THEN 1.0 ELSE 0.0 END END)
                   - AVG(CASE WHEN wadat BETWEEN '20260622' AND '20260726'
                              THEN CASE WHEN wadat_ist <> '00000000' AND wadat_ist <= wadat THEN 1.0 ELSE 0.0 END END),
                   4) AS rate_change
      FROM raw_sap_ecc.likp
      WHERE wadat BETWEEN '20260622' AND '20260823'
      GROUP BY vstel
    answer:
      keys: [vstel]
      values: [{column: rate_change, abs: 0.002}]

  - id: f05
    turns:
      - question: How many deliveries and how many delivery lines did Dongguan ship in fiscal period 11 of FY2026?
        expected_behavior: answer
      - question: So how many lines per delivery is that on average?
        expected_behavior: answer
    question: How does that compare with Longgang?
    role: ops_analyst_global
    category: followup
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [context_carryover, reversals, shared_plant]
    required_kb_docs: [metrics/lines_shipped.md, sites/dongguan.md]
    required_tables: [raw_sap_ecc.lips, raw_sap_ecc.vbup, raw_sap_ecc.likp]
    notes: >-
      Lines per shipped delivery in P11 = 2026-08-24..09-20, by shipping point (C300 Dongguan, C100 Longgang);
      reversed lines are not shipped.
    reference_sql: |
      SELECT k.vstel, ROUND(COUNT(*) / COUNT(DISTINCT k.vbeln), 3) AS lines_per_delivery
      FROM raw_sap_ecc.lips p
      JOIN raw_sap_ecc.vbup u ON u.vbeln = p.vbeln AND u.posnr = p.posnr
      JOIN raw_sap_ecc.likp k ON k.vbeln = p.vbeln
      WHERE u.wbsta = 'C' AND k.vstel IN ('C100', 'C300') AND k.wadat_ist BETWEEN '20260824' AND '20260920'
      GROUP BY k.vstel
    answer:
      keys: [vstel]
      values: [{column: lines_per_delivery, rel: 0.01}]

  - id: f06
    turns:
      - question: Which five materials did Longgang ship the most pieces of in fiscal period 11 of FY2026?
        expected_behavior: answer
    question: How much available stock of the top one does Longgang have right now?
    role: ops_analyst_global
    category: followup
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [context_carryover, material_numbers, units_of_measure]
    required_kb_docs: [metrics/lines_shipped.md, metrics/available_stock.md, sites/longgang.md]
    required_tables: [raw_sap_ecc.lips, raw_sap_ecc.vbup, raw_sap_ecc.likp, raw_sap_ecc.mard]
    notes: >-
      "The top one" is the first material of the earlier answer (40000713 on the loaded data). Available stock
      is unrestricted stock in the Longgang main warehouse (CN10, storage location 1000); Dongguan (3000) shares
      the plant and is not Longgang's stock.
    reference_sql: |
      WITH top_material AS (
        SELECT p.matnr
        FROM raw_sap_ecc.lips p
        JOIN raw_sap_ecc.vbup u ON u.vbeln = p.vbeln AND u.posnr = p.posnr
        JOIN raw_sap_ecc.likp k ON k.vbeln = p.vbeln
        WHERE u.wbsta = 'C' AND k.vstel = 'C100' AND k.wadat_ist BETWEEN '20260824' AND '20260920'
        GROUP BY p.matnr
        ORDER BY SUM(p.lgmng) DESC, ltrim('0', p.matnr)
        LIMIT 1
      )
      SELECT SUM(m.labst) AS available_qty
      FROM top_material t
      JOIN raw_sap_ecc.mard m ON m.matnr = t.matnr AND m.werks = 'CN10' AND m.lgort = '1000'
    answer:
      values: [{column: available_qty, abs: 0}]

  - id: f07
    turns:
      - question: How is Shenzhen doing?
        expected_behavior: clarify
      - question: I mean the on-time PGI rate in the last fiscal quarter.
        expected_behavior: answer
        acceptable_behaviors: [answer, answer_with_assumption]
    question: And Dongguan?
    role: ops_analyst_global
    category: followup
    expected_behavior: answer
    acceptable_behaviors: [answer, answer_with_assumption]
    trap_tags: [context_carryover, ambiguous_metric, fiscal_calendar]
    required_kb_docs: [metrics/on_time_pgi_rate.md, concepts/fiscal_calendar.md, sites/longgang.md]
    required_tables: [raw_sap_ecc.likp]
    notes: >-
      The first question has no metric or period, so the agent should ask; the answer to its question sets the
      metric and period for the rest of the thread. Last fiscal quarter as of 2026-09-21 = FY2026 Q3 =
      2026-04-27..07-26; Dongguan = shipping point C300.
    reference_sql: |
      SELECT vstel,
             ROUND(SUM(CASE WHEN wadat_ist <> '00000000' AND wadat_ist <= wadat THEN 1 ELSE 0 END)
                   / COUNT(*), 4) AS on_time_pgi_rate
      FROM raw_sap_ecc.likp
      WHERE vstel = 'C300' AND wadat BETWEEN '20260427' AND '20260726'
      GROUP BY vstel
    answer:
      values: [{column: on_time_pgi_rate, abs: 0.002}]

