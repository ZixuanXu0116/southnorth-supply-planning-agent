[project]
name = "snm-tools"
version = "0.0.0"
description = "MCP tool server: guarded, read-only data access for the analytics agent."
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp>=2.2",
    "snm-data",
    "sqlglot>=30.0",
]

[project.scripts]
snm-tools = "snm_tools.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snm_tools"]

[tool.uv.sources]
snm-data = { workspace = true }
